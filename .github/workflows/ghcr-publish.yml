name: Publish GHCR Image

on:
  workflow_call:
    inputs:
      image-artifact:
        required: true
        type: string
      validation-artifact:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish App Image
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download exact tested image
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.image-artifact }}
          path: image-evidence

      - name: Download test and upgrade evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.validation-artifact }}
          path: validation-evidence

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and publish the tested image
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -er '.sourceCommit' image-evidence/build-receipt.json)" = "$GITHUB_SHA"
          test "$(jq -er '.runtimeSmokePassed' image-evidence/build-receipt.json)" = true
          expected="$(jq -er '.archiveSha256' image-evidence/build-receipt.json)"
          actual="$(sha256sum image-evidence/portal-image.tar.gz | cut -d ' ' -f 1)"
          test "$actual" = "$expected"
          gzip -dc image-evidence/portal-image.tar.gz | docker load
          local_image="stasharr-portal-ci:$GITHUB_SHA"
          test "$(docker image inspect --format '{{.Id}}' "$local_image")" = "$(jq -er '.imageId' image-evidence/build-receipt.json)"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$local_image")" = "$GITHUB_SHA"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          immutable="$image:sha-$GITHUB_SHA"
          docker tag "$local_image" "$immutable"
          docker tag "$local_image" "$image:edge"
          docker push "$immutable"
          docker push "$image:edge"
          digest="$(docker buildx imagetools inspect "$immutable" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          jq --arg image "$immutable" --arg digest "$digest" \
            '. + {publishedImage:$image,digest:$digest,unitAndUpgradeJobsPassed:true}' \
            image-evidence/build-receipt.json > validation-evidence/release-receipt.json
          printf 'Published `%s@%s` from `%s`. Deployment is a separate reviewed step.\n' "$image" "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain release receipt and test evidence
        uses: actions/upload-artifact@v4
        with:
          name: portal-release-${{ github.sha }}-${{ github.run_attempt }}
          path: validation-evidence/
          if-no-files-found: error
          retention-days: 30
